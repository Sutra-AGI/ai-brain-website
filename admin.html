<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — AI Brain</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <meta name="theme-color" content="#08090b">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/home.css?v=6ab035f8">
  <link rel="stylesheet" href="/pages.css?v=6ab035f8">
  <link rel="stylesheet" href="/admin.css?v=6ab035f8">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" class="wrap admin">
    <header class="admin-head">
      <a href="/" class="logo">AI Brain</a>
      <span class="demo-flag mono">private</span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button" hidden>Log out</button>
    </header>

    <section id="loginView" class="form-card admin-login">
      <h1>Admin</h1>
      <p>Enter the <code class="mono">ADMIN_TOKEN</code> you set in Vercel → Settings → Environment Variables.</p>
      <form id="loginForm" class="f">
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="current-password" required minlength="16">
        <button class="btn btn-primary" type="submit" style="margin-top:16px">Open dashboard</button>
        <div class="form-msg" id="loginMsg" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="dashView" hidden>
      <div class="admin-tabs" role="tablist" aria-label="Submissions">
        <button role="tab" aria-selected="true" data-type="waitlist" type="button">Waitlist</button>
        <button role="tab" aria-selected="false" data-type="contact" type="button">Contact messages</button>
      </div>
      <div class="admin-bar">
        <p class="mono" id="countLine">Loading…</p>
        <div>
          <label for="filter" class="sr-only">Filter</label>
          <input id="filter" type="search" placeholder="Filter…" class="admin-filter">
          <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button">Refresh</button>
          <button class="btn btn-primary btn-sm" id="csvBtn" type="button">Download CSV</button>
        </div>
      </div>
      <div class="admin-table-wrap" tabindex="0" aria-label="Submissions table">
        <table class="admin-table" id="table"><thead></thead><tbody></tbody></table>
      </div>
    </section>
  </main>
  <script src="/admin.js?v=6ab035f8" defer></script>
</body>
</html>
